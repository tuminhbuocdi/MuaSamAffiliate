                try {
                    // Gọi sang API của trang đích (Server của bạn sẽ đóng vai trò ký HMAC rồi gọi ngầm sang mmx.today)
                    // Tuyệt đối KHÔNG giữ OFFER_TASK_CLIENT_SECRET trên Browser.
                    const response = await fetch('/api/complete-task', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            memberCode: memberCode,
                            taskID: taskID
                        })
                    });

                    const result = await response.json();
                    if (response.ok) {
                        showToast('Đã ghi nhận hoàn thành nhiệm vụ!');
                    } else {
                        console.warn("Server từ chối:", result.message || "Lỗi ghi nhận");
                    }
                } catch (error) {
                    console.error("Lỗi kết nối:", error);
                } finally {
                    // Sau khi gọi thành công hoặc thất bại, tự động xóa sạch param trên URL và biến để đưa về trạng thái web không data nhiệm vụ
                    memberCode = null;
                    taskID = null;
                    window.history.replaceState({}, document.title, window.location.pathname);
                    renderProducts(document.getElementById('search-input').value);
                }
            } else {
                showToast('Đang chuyển hướng đến trang mua hàng...');
            }
            
            setTimeout(() => {
                window.open(affLink, '_blank');
                buttonElement.disabled = false;
                buttonElement.classList.remove('opacity-50', 'cursor-not-allowed');
            }, 500);
        }

        document.getElementById('search-input').addEventListener('input', (e) => {
            renderProducts(e.target.value);
        });

        renderProducts();
    </script>
</body>
</html>
